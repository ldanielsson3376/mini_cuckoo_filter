[project]
name = "mini-cuckoo-filter"
version = "0.1.0"
description = "A minimal Cuckoo filter with no dependencies for set-membership testing that supports deletions"
requires-python = ">=3.10"
dependencies = []
readme = "README.md"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
